name: Feather City Java Analysis
on:
  workflow_dispatch:  # Allow manual triggering
  pull_request:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**/*.java'  # Only run when Java files change

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Feather City Analysis
        uses: livcristi/feather-city-action/java@livcristi/other_improvements
        with:
          input_dir: './src'
          metrics: 'loc,wmc,iss,cloc,cc,nom,ce,ca,stat'
          title: "My Sample Storage Service"
          project_description: "This is a description for my service, it stores object data on Azure"
          theme: 'dark'
          output_dir: 'visual'
          java_version: '8'
          pmd_version: '7.14.0'
          feather_city_version: '0.1.2'
#          color_palette: "magma"